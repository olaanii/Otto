name: otto_frontend
description: "Otto: Production-grade Atomic PR & Git Stacking Flutter Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  window_manager: ^0.3.9
  hotkey_manager: ^0.2.3
  uuid: ^4.4.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
